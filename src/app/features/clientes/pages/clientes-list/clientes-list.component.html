<app-module-table-shell eyebrow="CATÁLOGOS" title="Clientes" description="" [total]="visibleRecords().length">
  <p-button header-actions label="Nuevo cliente" icon="pi pi-plus" (onClick)="store.openCreate()" />
  <p-button header-actions styleClass="bulk-delete-button" [label]="'Desactivar seleccionados (' + selectedRecords.length + ')'" icon="pi pi-trash" severity="danger" [outlined]="true" [disabled]="selectedRecords.length === 0" (onClick)="deactivateSelected()" />

  <div toolbar-right class="catalog-filters">
    <div class="search-box">
      <i class="pi pi-search"></i>
      <input pInputText type="text" placeholder="Buscar clientes" (input)="filterGlobal($event)" />
    </div>
    <app-inactive-records-filter [checked]="showInactive()" (checkedChange)="toggleInactive($event)" />
  </div>

  <p-table
    #table
    [value]="visibleRecords()"
    [(selection)]="selectedRecords"
    [metaKeySelection]="false"
    [loading]="store.loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [rowTrackBy]="trackById"
    [globalFilterFields]="['businessName', 'commercialName', 'rfc', 'status']"
    styleClass="p-datatable-sm clientes-table app-data-table"
    [tableStyle]="{ 'min-width': '48rem' }">
    <ng-template #header>
      <tr>
        <th class="selection-column"><p-tableHeaderCheckbox /></th>
        <th><div class="filterable-header"><span class="filterable-header__title" pSortableColumn="businessName">Razón social <p-sortIcon field="businessName" /></span><p-columnFilter type="text" display="row" field="businessName" matchMode="contains" [showMenu]="false" /></div></th>
        <th><div class="filterable-header"><span class="filterable-header__title" pSortableColumn="commercialName">Nombre comercial <p-sortIcon field="commercialName" /></span><p-columnFilter type="text" display="row" field="commercialName" matchMode="contains" [showMenu]="false" /></div></th>
        <th><div class="filterable-header"><span class="filterable-header__title" pSortableColumn="rfc">RFC <p-sortIcon field="rfc" /></span><p-columnFilter type="text" display="row" field="rfc" matchMode="contains" [showMenu]="false" /></div></th>
        <th><div class="filterable-header"><span class="filterable-header__title" pSortableColumn="status">Estatus <p-sortIcon field="status" /></span><p-columnFilter field="status" matchMode="equals" [showMenu]="false"><ng-template #filter let-value let-filter="filterCallback"><select class="column-filter-select" [value]="value ?? ''" (change)="filter($any($event.target).value || null)"><option value="">Todos</option><option value="Activo">Activo</option><option value="Inactivo">Inactivo</option></select></ng-template></p-columnFilter></div></th>
        <th class="actions-column">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-record>
      <tr>
        <td class="selection-column"><p-tableCheckbox [value]="record" [disabled]="record.status !== 'Activo'" /></td>
        <td><div class="table-cell-text">{{ record.businessName }}</div></td>
        <td><div class="table-cell-text">{{ record.commercialName }}</div></td>
        <td><div class="table-cell-text">{{ record.rfc }}</div></td>
        <td><p-tag [value]="record.status" [severity]="statusSeverity(record.status)" /></td>
        <td>
          <div class="table-cell-actions">
            <!-- <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="secondary" (onClick)="store.openEdit(record)" ariaLabel="Editar" /> -->
            @if (record.status === 'Activo') {
              <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" (onClick)="store.deactivate(record)" ariaLabel="Desactivar" />
            } @else {
              <p-button icon="pi pi-check-circle" [text]="true" [rounded]="true" severity="success" (onClick)="store.activate(record)" ariaLabel="Activar" />
            }
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="empty">No hay clientes registrados.</td>
      </tr>
    </ng-template>
  </p-table>
</app-module-table-shell>

<app-clientes-form [store]="store" />
