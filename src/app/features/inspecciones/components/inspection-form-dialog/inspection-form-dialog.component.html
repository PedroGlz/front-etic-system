<p-dialog
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '33rem', maxWidth: '95vw' }"
  [visible]="store().dialogVisible()"
  [header]="store().isEditing() ? 'Editar inspección' : 'Nueva inspección'"
  (visibleChange)="!$event ? store().closeDialog() : null">
  <form class="inspection-form" [formGroup]="store().form">
    <div class="grid">
      <label>
        <span>Cliente</span>
        <p-select formControlName="clientId" [options]="store().clientOptions()" optionLabel="label" optionValue="id" placeholder="Selecciona un cliente" [filter]="true" filterBy="label" [fluid]="true" appendTo="body" (onChange)="store().onClientChange()" />
        @if (store().isInvalid('clientId')) {
          <small>El cliente es obligatorio.</small>
        }
      </label>

      <label>
        <span>Grupo de sitios</span>
        <p-select formControlName="siteGroupId" [options]="store().siteGroupOptions()" optionLabel="label" optionValue="id" placeholder="Selecciona un grupo" [filter]="true" filterBy="label" [fluid]="true" appendTo="body" [disabled]="!store().form.controls.clientId.value" (onChange)="store().onSiteGroupChange()" />
        @if (store().isInvalid('siteGroupId')) {
          <small>El grupo de sitios es obligatorio.</small>
        }
      </label>
    </div>

    <div class="grid">
      <label>
        <span>Sitio</span>
        <p-select formControlName="siteId" [options]="store().siteOptions()" optionLabel="label" optionValue="id" placeholder="Selecciona un sitio" [filter]="true" filterBy="label" [fluid]="true" appendTo="body" [disabled]="!store().form.controls.siteGroupId.value" />
        @if (store().isInvalid('siteId')) {
          <small>El sitio es obligatorio.</small>
        }
      </label>

      <!-- <label>
        <span>Estatus</span>
        <select formControlName="statusId">
          @for (option of store().statusOptions(); track option.id) {
            <option [value]="option.id">{{ option.label }}</option>
          }
        </select>
      </label> -->
    </div>

    <div class="grid">
      <label>
        <span>Fecha de inicio</span>
        <p-datepicker
          formControlName="startDate"
          dateFormat="yy-mm-dd"
          appendTo="body"
          styleClass="inspection-datepicker"
          inputStyleClass="inspection-datepicker-input"
          panelStyleClass="inspection-datepicker-panel"
          [baseZIndex]="1300"
          [showIcon]="true"
          [fluid]="true" />
        @if (store().isInvalid('startDate')) {
          <small>La fecha de inicio es obligatoria.</small>
        }
      </label>

      <!-- <label>
        <span>Fecha final</span>
        <input type="date" formControlName="endDate" [readOnly]="!store().isClosedSelected()" />
        @if (store().isClosedSelected() && !store().form.controls.endDate.value && store().form.controls.endDate.touched) {
          <small>La fecha final es obligatoria cuando la inspección se cierra.</small>
        }
      </label> -->
    </div>

  </form>

  <ng-template pTemplate="footer">
    <div class="dialog-actions">
      <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="store().closeDialog()" />
      <p-button [label]="store().isEditing() ? 'Guardar cambios' : 'Crear inspección'" [loading]="store().saving()" (onClick)="store().save()" />
    </div>
  </ng-template>
</p-dialog>
