<app-module-table-shell eyebrow="CATÁLOGOS" title="Grupos de sitios" description="" [total]="visibleRecords().length">
  <p-button header-actions label="Nuevo grupo" icon="pi pi-plus" (onClick)="store.openCreate()" />
  <p-button header-actions styleClass="bulk-delete-button" [label]="'Desactivar seleccionados (' + selectedRecords.length + ')'" icon="pi pi-trash" severity="danger" [outlined]="true" [disabled]="selectedRecords.length === 0" (onClick)="deactivateSelected()" />

  <div toolbar-right class="catalog-filters">
    <div class="search-box"><i class="pi pi-search"></i><input pInputText type="text" placeholder="Buscar grupos" (input)="filterGlobal($event)" /></div>
    <app-inactive-records-filter [checked]="showInactive()" (checkedChange)="toggleInactive($event)" />
  </div>

  <p-table
    #table
    [value]="visibleRecords()"
    [(selection)]="selectedRecords"
    [metaKeySelection]="false"
    [loading]="store.loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [rowTrackBy]="trackById"
    [globalFilterFields]="['clientName', 'name', 'status']"
    styleClass="p-datatable-sm app-data-table"
    [tableStyle]="{ 'min-width': '44rem' }">
    <ng-template #header>
      <tr>
        <th class="selection-column"><p-tableHeaderCheckbox /></th>
        <th pSortableColumn="clientName"><div class="filterable-header"><span class="filterable-header__title">Cliente <p-sortIcon field="clientName" /></span><p-columnFilter field="clientName" matchMode="equals" [showMenu]="false"><ng-template #filter let-value let-filter="filterCallback"><select class="column-filter-select" [value]="value ?? ''" (click)="$event.stopPropagation()" (change)="filter($any($event.target).value || null)"><option value="">Todos</option>@for (option of clientFilterOptions(); track option) { <option [value]="option">{{ option }}</option> }</select></ng-template></p-columnFilter></div></th>
        <th pSortableColumn="name"><div class="filterable-header"><span class="filterable-header__title">Grupo <p-sortIcon field="name" /></span><p-columnFilter type="text" display="row" field="name" matchMode="contains" [showMenu]="false" /></div></th>
        <th pSortableColumn="status"><div class="filterable-header"><span class="filterable-header__title">Estatus <p-sortIcon field="status" /></span><p-columnFilter field="status" matchMode="equals" [showMenu]="false"><ng-template #filter let-value let-filter="filterCallback"><select class="column-filter-select" [value]="value ?? ''" (click)="$event.stopPropagation()" (change)="filter($any($event.target).value || null)"><option value="">Todos</option><option value="Activo">Activo</option><option value="Inactivo">Inactivo</option></select></ng-template></p-columnFilter></div></th>
        <th class="actions-column">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-record>
      <tr>
        <td class="selection-column"><p-tableCheckbox [value]="record" [disabled]="record.status !== 'Activo'" /></td>
        <td><div class="table-cell-text">{{ record.clientName ?? '—' }}</div></td>
        <td><div class="table-cell-text">{{ record.name }}</div></td>
        <td><p-tag [value]="record.status" [severity]="statusSeverity(record.status)" /></td>
        <td>
          <div class="table-cell-actions">
            <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="secondary" (onClick)="store.openEdit(record)" ariaLabel="Editar" />
            @if (record.status === 'Activo') {
              <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" (onClick)="store.deactivate(record)" ariaLabel="Desactivar" />
            } @else {
              <p-button icon="pi pi-check-circle" [text]="true" [rounded]="true" severity="success" (onClick)="store.activate(record)" ariaLabel="Activar" />
            }
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5" class="empty">No hay grupos registrados.</td>
      </tr>
    </ng-template>
  </p-table>
</app-module-table-shell>

<app-grupos-sitios-form [store]="store" />
